[package]
name = "tibs"
version = "0.5.7"
edition = "2024"

[lib]
name = "tibs"
crate-type = ["cdylib"]

[dependencies]
hex = "~0.4"
pyo3 = { version = "~0.28", features = ["extension-module", "abi3-py38"] }
bitvec = "~1.0"
bytemuck = "~1.25"
lru = "~0.16"
once_cell = "~1.21"
rand = "~0.10"
sha2 = "0.10.8"
half = "~2.7"

[profile.release]
lto = "fat"
codegen-units = 1
