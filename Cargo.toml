[package]
name = "tibs"
version = "2.0.0-rc1"
edition = "2024"
description = "A sleek Python library for binary data."
license = "MIT"
repository = "https://github.com/scott-griffiths/tibs"
homepage = "https://github.com/scott-griffiths/tibs"
documentation = "https://tibs.readthedocs.io/"
readme = "README.md"

[lib]
name = "tibs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "~0.29", features = ["extension-module", "abi3-py311"] }
bitvec = "~1.1"
rand = "~0.10"
sha2 = "~0.11"
half = "~2.7"
zstd = "~0.13"
memchr = "~2.8"

[profile.release]
lto = "fat"
codegen-units = 1

# Optimised like release but without the link-time work, for the rebuild-and-run
# loop. Roughly twice as fast to build, and every test passes on it just the
# same.
#
# Never measure on this profile. Fat LTO with a single codegen unit is what
# decides how the hot kernels inline, and several of them are written the way
# they are because of it - see the comment on `count_pair_bits_with_wide`, where
# one refactor that removed duplication cost `count_or` and `count_xor` a factor
# of three. None of that is visible here, so timings taken on this profile look
# plausible and mean nothing. Benchmarks, guards and releases all use `release`.
[profile.fastdev]
inherits = "release"
lto = false
codegen-units = 16
