[package]
name = "tibs"
version = "1.0.0-beta.0"
edition = "2024"

[lib]
name = "tibs"
crate-type = ["cdylib"]

[dependencies]
hex = "~0.4"
pyo3 = { version = "~0.29", features = ["extension-module", "abi3-py310"] }
bitvec = "~1.1"
bytemuck = "~1.25"
lru = "~0.18"
once_cell = "~1.21"
rand = "~0.10"
sha2 = "~0.11"
half = "~2.7"
zstd = "~0.13"
memchr = "~2.8"

[profile.release]
lto = "fat"
codegen-units = 1
