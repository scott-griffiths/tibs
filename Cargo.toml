[package]
name = "tibs"
version = "1.2.0"
edition = "2024"
description = "A sleek Python library for binary data."
license = "MIT"
repository = "https://github.com/scott-griffiths/tibs"
homepage = "https://github.com/scott-griffiths/tibs"
documentation = "https://tibs.readthedocs.io/"
readme = "README.md"

[lib]
name = "tibs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "~0.29", features = ["extension-module"] }
bitvec = "~1.1"
rand = "~0.10"
sha2 = "~0.11"
half = "~2.7"
zstd = "~0.13"
memchr = "~2.8"

[features]
default = ["abi3"]
# The buffer protocol (Tibs's memoryview support) only became part of Python's
# stable/limited ABI in 3.11, so the abi3 wheel targets that floor. A separate
# non-abi3, version-pinned build is used for Python 3.10 (see CI).
abi3 = ["pyo3/abi3-py311"]

[profile.release]
lto = "fat"
codegen-units = 1
