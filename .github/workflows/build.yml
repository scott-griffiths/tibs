name: Build

on:
  push:
    branches: [ stable, main ]
    tags: [ v* ]
  pull_request:
    branches: [ '**' ]

jobs:
  meta:
    name: Meta (always)
    runs-on: ubuntu-latest
    steps:
      - name: Record event
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"

  build:
    needs: meta
    # Always create a workflow run on push/PR so downstream workflows can trigger.
    # Only do the expensive wheel build on tags or when commit message requests a full build.
    name: Build wheels on ${{ matrix.os }}${{ matrix.macos-arch && format(' ({0})', matrix.macos-arch) || '' }}
    runs-on: ${{ matrix.os }}
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-build]')) ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[full-build]')) }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is split by arch so we *always* get Intel + Apple Silicon wheels.
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: windows-latest
          - os: macos-14
            macos-arch: x86_64
          - os: macos-15
            macos-arch: arm64

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{ (matrix.os == 'macos-14' && 'x86_64-apple-darwin') ||
                (matrix.os == 'macos-15' && 'aarch64-apple-darwin') ||
                (matrix.os == 'ubuntu-latest' && 'x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,powerpc64le-unknown-linux-gnu') ||
                (matrix.os == 'ubuntu-24.04-arm' && 'aarch64-unknown-linux-gnu') ||
                (matrix.os == 'windows-latest' && 'x86_64-pc-windows-msvc,i686-pc-windows-msvc') ||
                '' }}

      # Linux-specific setup for cross-compilation host
      - name: Linux cross-compilation setup
        if: matrix.os == 'ubuntu-latest' # Runs on the x64 host
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-powerpc64le-linux-gnu g++-powerpc64le-linux-gnu

      - name: Set up QEMU
        if: runner.os == 'Linux' && runner.arch == 'X64' # For emulating other archs on x64 Linux runner
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all # arm64, ppc64le etc.

      # Windows: install and run cibuildwheel manually
      - name: Build wheels (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Set environment variables directly in PowerShell
          $env:CIBW_ARCHS_WINDOWS = 'auto'
          $env:CIBW_BUILD_VERBOSITY = 3

          # Ensure Cargo is in the PATH
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"

          # Run cibuildwheel
          python -m pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      # Linux and macOS: use the action
      - name: Build wheels (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: pypa/cibuildwheel@v2.23.2
        env:
          CIBW_BUILD_VERBOSITY: 3
          CIBW_BUILD: "cp38-*"  # If we use the stable ABI we only need one wheel per arch.
          CIBW_ARCHS_LINUX: ${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64 aarch64 ppc64le i686' }}
          # Critical: pin the macOS architecture per job so we actually upload both.
          CIBW_ARCHS_MACOS: ${{ matrix.macos-arch || 'auto' }}
          CIBW_ENVIRONMENT: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_BEFORE_ALL_LINUX: >
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
            source $HOME/.cargo/env
          CIBW_SKIP: "*-musllinux_i686"
          CIBW_BEFORE_BUILD_MACOS: >
            rustup target add x86_64-apple-darwin aarch64-apple-darwin
          MACOSX_DEPLOYMENT_TARGET: 10.12
          CIBW_MANYLINUX_X86_64_IMAGE: "quay.io/pypa/manylinux2014_x86_64:latest"
          CIBW_MANYLINUX_I686_IMAGE: "quay.io/pypa/manylinux2014_i686:latest"
          CIBW_MANYLINUX_AARCH64_IMAGE: "quay.io/pypa/manylinux2014_aarch64:latest"
          CIBW_MANYLINUX_PPC64LE_IMAGE: "quay.io/pypa/manylinux2014_ppc64le:latest"
          CIBW_MANYLINUX_S390X_IMAGE: "quay.io/pypa/manylinux2014_s390x:latest"
          CIBW_MUSLLINUX_X86_64_IMAGE: "quay.io/pypa/musllinux_1_2_x86_64:latest"
          CIBW_MUSLLINUX_I686_IMAGE: "quay.io/pypa/musllinux_1_2_i686:latest"

      - name: Build sdist
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install build
          python -m build --sdist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # include macOS arch in the artifact name so downstream can fetch both
          name: packages-${{ matrix.os }}${{ matrix.macos-arch && format('-{0}', matrix.macos-arch) || '' }}
          path: |
            ./wheelhouse/*.whl
            ./dist/*.tar.gz
          if-no-files-found: error

  verify-coverage:
    name: Verify wheel coverage
    needs: build
    if: always() && (startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[full-build]'))
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Coverage report + required wheel checks
        run: |
          set -euo pipefail
          echo "== Artifacts =="
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -maxdepth 4 | sort
          echo ""

          echo "== Wheel file names =="
          find artifacts -type f -name "*.whl" -maxdepth 4 -print0 | xargs -0 -n1 basename | sort || true
          echo ""

          need() {
            local pattern="$1"
            local label="$2"
            local count
            count=$(find artifacts -type f -name "*.whl" -maxdepth 4 | grep -E -c "$pattern" || true)
            if [[ "$count" -lt 1 ]]; then
              echo "Missing required wheel: $label (pattern: $pattern)" >&2
              return 1
            fi
            echo "OK: $label"
          }

          # Must-have coverage checks
          need "macosx_10_12_x86_64|macosx_10_1[3-9]_x86_64" "macOS Intel (x86_64)"
          need "macosx_11_0_arm64|macosx_11_0_universal2|macosx_1[2-9]_0_arm64" "macOS Apple Silicon (arm64/universal2)"
          need "manylinux.*x86_64" "Linux manylinux x86_64"
          need "manylinux.*aarch64" "Linux manylinux aarch64"
          need "manylinux.*ppc64le" "Linux manylinux ppc64le"
          need "win_amd64" "Windows x86_64"
          # Optional, but nice:
          # need "win32" "Windows i686"

          echo ""
          echo "Coverage checks passed."
