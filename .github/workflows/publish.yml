name: Publish

on:
  workflow_run:
    workflows: [ Test ]
    types: [ completed ]

jobs:
  check-tag:
    name: Check for release tag
    # Only consider publishing when Test succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      is_tag: ${{ steps.tag.outputs.is_tag }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
      build_run_id: ${{ steps.build_run.outputs.build_run_id || steps.build_run_default.outputs.build_run_id }}
    steps:
      - name: Download source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags (authoritative)
        shell: bash
        run: |
          set -euo pipefail
          # Ensure we have all tags and the commit object for the triggering SHA.
          git remote -v
          git fetch --force --prune --tags origin "+refs/tags/*:refs/tags/*"
          git cat-file -e "${{ github.event.workflow_run.head_sha }}^{commit}"

      - name: Get tag information
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          sha="${{ github.event.workflow_run.head_sha }}"

          # Prefer local tags if present.
          TAG="$(git tag --points-at "$sha" | grep -E '^v' | head -n 1 || true)"

          # Fallback: ask the remote for tags pointing at this SHA (more reliable in workflow_run contexts).
          if [[ -z "$TAG" ]]; then
            TAG="$(git ls-remote --tags origin | awk -v SHA="$sha" '$1==SHA {print $2}' | sed 's#refs/tags/##' | sed 's/\^{}$//' | grep -E '^v' | head -n 1 || true)"
          fi

          echo "Found tag: ${TAG:-<none>}"

          if [[ "$TAG" == v* ]]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

            if [[ "$TAG" == *-alpha* || "$TAG" == *-beta* ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download upstream Build run id artifact (from this Test run)
        if: ${{ steps.tag.outputs.is_tag == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: upstream-build-run
          path: workflow_meta

      - name: Read upstream Build run id
        id: build_run
        if: ${{ steps.tag.outputs.is_tag == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          build_run_id="$(cat workflow_meta/build_run_id.txt)"
          if [[ -z "$build_run_id" ]]; then
            echo "Missing build_run_id" >&2
            exit 1
          fi
          echo "build_run_id=$build_run_id" >> "$GITHUB_OUTPUT"

      - name: Set default build_run_id output (non-tag runs)
        id: build_run_default
        if: ${{ steps.tag.outputs.is_tag != 'true' }}
        shell: bash
        run: |
          # Provide a harmless default so job outputs always exist.
          echo "build_run_id=" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to PyPI
    needs: check-tag
    if: ${{ needs.check-tag.outputs.is_tag == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build.yml
          run_id: ${{ needs.check-tag.outputs.build_run_id }}
          workflow_conclusion: success
          path: artifacts

      - name: Prepare distribution files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec mv {} dist/ \;
          ls -l dist/

      - name: Publish to PyPI
        if: needs.check-tag.outputs.is_prerelease == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
