name: Test

on:
  workflow_run:
    workflows: [ Build ]
    types: [ completed ]

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test ${{ matrix.os.name }} ${{ matrix.python.name }}
    runs-on: ${{ matrix.os.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            emoji: ":penguin:"
            runs-on: ubuntu-latest
            artifact: packages-ubuntu-latest
          - name: macOS
            emoji: ":apple:"
            runs-on: macos-14
            artifact: packages-macos-14-x86_64
          - name: Windows
            emoji: ":window:"
            runs-on: windows-latest
            artifact: packages-windows-latest
        python:
          - name: CPython 3.8
            action: '3.8'
          - name: CPython 3.9
            action: '3.9'
          - name: CPython 3.10
            action: '3.10'
          - name: CPython 3.11
            action: '3.11'
          - name: CPython 3.12
            action: '3.12'
          - name: CPython 3.13
            action: '3.13'
          - name: CPython 3.14
            action: '3.14'
        exclude:
          - os:
              runs-on: macos-14
            python:
              name: CPython 3.8
              action: '3.8'
          - os:
              runs-on: macos-14
            python:
              name: CPython 3.9
              action: '3.9'
          - os:
              runs-on: macos-14
            python:
              name: CPython 3.10
              action: '3.10'

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build.yml
          name: ${{ matrix.os.artifact }}
          path: dist

      # Setup steps
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python.action }}
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Test
        run: |
          uv venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .venv\\Scripts\\activate
          else
            source .venv/bin/activate
          fi
          ./build.sh